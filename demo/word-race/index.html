<script>
/* Englishia account (one login for all games). Guests play with just a name if it can't load. */
(function(){var s=document.createElement("script");s.src="../js/englishia-auth.js?v=12.8";
s.onload=function(){try{EnglishiaAuth.init({gameId:"word-race",gameTitle:"\u05DE\u05D9\u05E8\u05D5\u05E5 \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD",mount:false});if(window.WRApp)WRApp.onAuth();}catch(e){console.warn(e);}};
s.onerror=function(){};document.head.appendChild(s);})();
</script>
<script>
/* Official build on englishia.app: show the short address (englishia.app/word-race). Every asset URL above is already resolved,
   and the game keeps the short path when it later adds ?code=. A reload goes through the root /word-race/ redirect. */
(function(){try{if(location.hostname==="englishia.app"&&/^\/games\/word-race\/(index\.html)?$/.test(location.pathname))history.replaceState(null,"","/word-race/"+location.search+location.hash);}catch(e){}})();
</script>
